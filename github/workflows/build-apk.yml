name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip openjdk-17-jdk unzip zip curl
        pip install --upgrade pip
        pip install buildozer Cython

    - name: Install Android SDK tools
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
        cd /usr/local/lib/android/sdk/cmdline-tools/latest
        sudo curl -s https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o tools.zip
        sudo unzip -q tools.zip
        sudo rm tools.zip
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH" >> $GITHUB_ENV

    - name: Accept licenses
      run: yes | sdkmanager --licenses

    - name: Install required build-tools
      run: |
        sdkmanager "platforms;android-33" "platform-tools" "build-tools;33.0.2"

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: RideuxCalculatorKivy
        path: bin/*.apk
