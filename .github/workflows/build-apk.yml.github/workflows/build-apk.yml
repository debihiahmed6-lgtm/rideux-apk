name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المشروع
        uses: actions/checkout@v3

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت Buildozer و dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools python3-dev \
                              build-essential git zip unzip openjdk-11-jdk \
                              autoconf automake libtool pkg-config zlib1g-dev \
                              libncurses5-dev libffi-dev libssl-dev
          python3 -m pip install --upgrade pip
          pip install buildozer cython

      - name: إنشاء APK 32-bit
        run: |
          buildozer android debug

      - name: إنشاء APK 64-bit
        run: |
          buildozer android debug --arch=arm64

      - name: حفظ ملفات APK
        uses: actions/upload-artifact@v4
        with:
          name: rideux-apk
          path: bin/*.apk
