
name: Build APK (32-bit)

on:
  workflow_dispatch: # يسمح لك بتشغيل البناء يدويًا من زر Run workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip openjdk-17-jdk unzip git
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Setup Android SDK & NDK
      run: |
        sudo apt-get install -y wget
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform

        # تنزيل Android SDK commandline tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O sdk-tools.zip
        mkdir -p android-sdk
        unzip sdk-tools.zip -d android-sdk/cmdline-tools
        mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

        # تثبيت الأدوات
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=android-sdk "platforms;android-31" "platform-tools" "build-tools;31.0.0" "ndk;21.4.7075529"

        echo "sdk.dir=$HOME/.buildozer/android/platform/android-sdk" > local.properties
        echo "ndk.dir=$HOME/.buildozer/android/platform/android-sdk/ndk/21.4.7075529" >> local.properties

    - name: Build with Buildozer (armeabi-v7a only)
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install buildozer cython

        # نجبر buildozer يبني فقط armeabi-v7a (32-bit)
        sed -i 's/^# *android.arch =.*/android.arch = armeabi-v7a/' buildozer.spec

        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RideuxCalculatorApp-APK32
        path: bin/*.apk
